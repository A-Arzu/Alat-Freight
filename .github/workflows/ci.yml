name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: agent + api tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Story arc (plan -> disruption -> recovery)
        run: python test_pipeline.py
      - name: All disruption scenarios
        run: python test_scenarios.py
      - name: Email delivery (validation, SSL, STARTTLS, failure)
        run: python test_email.py
      - name: Hardening regressions
        run: python test_hardening.py
      - name: Gemma second-model audit (mocked)
        run: python test_gemma.py
      - name: ADK agent + tool construction
        run: python test_adk_wiring.py
      - name: API smoke test (plan + disruption over HTTP)
        run: |
          STORE=memory PLANNER=mock TRACE_DELAY_MS=0 RUN_TOKEN=ci-token python -m uvicorn api.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf -X POST "localhost:8000/optimize?sync=true" -H 'X-Run-Token: ci-token' -d '' -o /dev/null
          curl -sf -X POST "localhost:8000/events?sync=true" -H 'X-Run-Token: ci-token' -H 'Content-Type: application/json' -d '{"scenario":"wagon_breakdown"}' -o /dev/null
          curl -sf localhost:8000/api/state -o state.json
          python ci_smoke_check.py state.json

  frontend:
    name: dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-fund --no-audit
        working-directory: web
      - run: npm run build
        working-directory: web
